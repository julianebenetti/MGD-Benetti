<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minha Pauta</title>
<style>
:root{
  --bg:#fbf7f8; --card:#ffffff; --line:#eee6e9; --text:#1c1a1b; --muted:#7a7075;
  --hero:#f0d5e3; --accent:#c2548a; --ok:#2f8f5b; --warn:#b45309;
  --r:18px; --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);padding-bottom:80px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:5;background:rgba(251,247,248,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;padding:14px 0 8px;font-weight:800;font-size:20px;letter-spacing:-.5px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--hero);display:grid;place-items:center}
.logo i{width:20px;height:20px;border-radius:6px;background:#22a45d;display:block}
nav{display:flex;gap:6px;padding-bottom:10px;overflow-x:auto}
nav button{border:0;background:none;font:600 15px var(--font);padding:9px 14px;border-radius:12px;color:var(--text);white-space:nowrap;cursor:pointer}
nav button.on{background:var(--hero)}
.hero{margin:16px 0;background:var(--hero);border-radius:var(--r);padding:22px}
.hero small{letter-spacing:.14em;font-weight:700;font-size:11px}
.hero h1{margin:6px 0 4px;font-size:30px;letter-spacing:-1px}
.hero p{margin:0;color:#4a4044}
.daybar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.daybar b{font-size:14px}
input[type=date],input[type=text],input[type=time],input[type=number],select,textarea{
  font:15px var(--font);border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;color:var(--text);width:100%}
.daybar input{width:auto}
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;font:600 14px var(--font);cursor:pointer;color:var(--text)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{padding:7px 12px;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.chip{border:2px solid transparent;border-radius:12px;padding:9px 14px;font:600 14px var(--font);cursor:pointer;color:var(--text)}
.chip.on{border-color:var(--text)}
h2{font-size:22px;letter-spacing:-.6px;margin:26px 0 12px;display:flex;justify-content:space-between;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.focus{border-left:5px solid var(--accent)}
.focus small{letter-spacing:.14em;font-weight:700;font-size:11px;color:var(--muted)}
.focus h3{margin:6px 0;font-size:22px;letter-spacing:-.5px}
.meta{color:var(--muted);font-size:14px}
.row{display:grid;grid-template-columns:64px 1fr;gap:6px 12px;padding:14px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.row .t{font-weight:700;font-size:14px}
.row .ti{font-weight:700;font-size:16px;letter-spacing:-.3px}
.row.done .ti{text-decoration:line-through;color:var(--muted)}
.row .act{grid-column:1/-1;display:flex;justify-content:flex-end;align-items:center;gap:12px}
.tag{display:inline-block;font-size:12px;border-radius:8px;padding:2px 8px;margin-top:4px;color:var(--text)}
label.check{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;cursor:pointer}
label.check input{appearance:none;width:26px;height:26px;border:2px solid #9a8f95;border-radius:8px;margin:0;display:grid;place-items:center;cursor:pointer;background:#fff}
label.check input:checked{background:var(--ok);border-color:var(--ok)}
label.check input:checked::after{content:"✓";color:#fff;font-size:17px;font-weight:800}
.bar{height:12px;background:#eadfe4;border-radius:99px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.empty{color:var(--muted);padding:6px 0}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center;cursor:pointer}
.wd.today{border-color:var(--accent);border-width:2px}
.wd.sel{background:var(--hero)}
.wd small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase}
.wd b{display:block;font-size:18px;margin:2px 0}
.wd span{font-size:12px;color:var(--muted)}
.wd.full span{color:var(--ok);font-weight:700}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.open{display:flex}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:20px;max-height:92vh;overflow:auto}
.sheet h3{margin:0 0 14px;font-size:20px}
.f{margin-bottom:12px}.f>label{display:block;font-size:13px;font-weight:700;margin-bottom:5px;color:var(--muted)}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days label{border:1px solid var(--line);border-radius:10px;padding:8px 11px;font-size:14px;cursor:pointer}
.days input{display:none}.days input:checked+span{font-weight:800;color:var(--accent)}
.days label:has(input:checked){background:var(--hero);border-color:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.foot{display:flex;gap:10px;justify-content:space-between;margin-top:16px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;border-radius:12px;padding:10px 16px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:30}
.toast.on{opacity:1}
.insight{background:#fff8e1;border:1px solid #f1dfa0;border-radius:var(--r);padding:16px;margin-bottom:6px}
.insight h3{margin:0 0 8px;font-size:17px}
.insight ul{margin:0;padding-left:20px;line-height:1.5;font-size:15px}
.insight li{margin-bottom:5px}
.alerta{background:#fde8e8;border:2px solid #e04848;color:#7a1414;border-radius:var(--r);padding:14px 16px;margin-bottom:12px;font-weight:700;line-height:1.4}
.lotes{margin-bottom:6px}
.lote{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.lote:last-child{border:0}
.pill{display:inline-block;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:800;background:#eee}
.pill.hoje,.pill.venc{background:#e04848;color:#fff}
.pill.amanha{background:#f6a23b;color:#fff}
.pill.ok{background:#d9f0e2;color:#1d6b43}
.lote .act2{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.view{display:none}.view.on{display:block}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="brand"><div class="logo"><i></i></div>Minha Pauta.</div>
  <nav id="nav">
    <button data-v="hoje" class="on">🕒 Hoje</button>
    <button data-v="semana">📅 Pauta semanal</button>
    <button data-v="todas">🗂 Atividades</button>
  </nav>
</div></header>

<main class="wrap">
  <section class="hero">
    <small>ESTÚDIO EDITORIAL</small>
    <h1 id="heroTitle">Minha pauta de hoje</h1>
    <p id="heroDate"></p>
  </section>

  <div class="daybar">
    <b>Dia da pauta</b>
    <input type="date" id="dia">
    <button class="btn sm" id="hojeBtn">Voltar para hoje</button>
  </div>
  <div class="chips" id="chips"></div>

  <!-- HOJE -->
  <div class="view on" id="v-hoje">
    <div id="alerta"></div>
    <div id="lotesBox"></div>
    <div id="insights"></div>
    <h2>Em foco</h2>
    <div id="foco"></div>
    <h2>Atividades do dia <button class="btn sm" data-add>+ Atividade</button></h2>
    <div class="card" id="lista"></div>
    <h2>Progresso do dia</h2>
    <div class="card"><b id="progTxt"></b><div class="bar"><i id="progBar"></i></div></div>
  </div>

  <!-- SEMANA -->
  <div class="view" id="v-semana">
    <h2>Semana</h2>
    <div class="week" id="semana"></div>
    <p class="meta">Toque num dia para ver a pauta dele.</p>
  </div>

  <!-- TODAS -->
  <div class="view" id="v-todas">
    <h2>Todas as atividades <button class="btn sm" data-add>+ Atividade</button></h2>
    <div class="card" id="todas"></div>
    <h2>Backup</h2>
    <div class="card">
      <p class="meta" style="margin-top:0">Por enquanto os dados ficam salvos neste aparelho. Exporte de vez em quando.</p>
      <button class="btn sm" id="exp">Exportar</button>
      <button class="btn sm" id="imp">Importar</button>
      <input type="file" id="impFile" accept="application/json" hidden>
    </div>
  </div>
</main>

<div class="modal" id="modal"><div class="sheet">
  <h3 id="mTitle">Nova atividade</h3>
  <div class="f"><label>Atividade</label><input type="text" id="fTitulo" placeholder="Ex.: Postar um vídeo no TikTok"></div>
  <div class="two">
    <div class="f"><label>Canal</label><select id="fCanal"></select></div>
    <div class="f"><label>Horário (opcional)</label><input type="time" id="fHora"></div>
  </div>
  <div class="f"><label>Repete</label>
    <select id="fRec">
      <option value="daily">Todos os dias</option>
      <option value="weekly">Dias da semana</option>
      <option value="monthly">Todo mês, num dia</option>
      <option value="once">Só uma vez (na data escolhida)</option>
    </select></div>
  <div class="f" id="fDiasBox"><label>Dias</label><div class="days" id="fDias"></div></div>
  <div class="f" id="fDomBox"><label>Dia do mês</label><input type="number" id="fDom" min="1" max="31"></div>
  <div class="f"><label>Observação (opcional)</label><input type="text" id="fObs" placeholder="Ex.: Aluguel · Rubens · R$ 600,00"></div>
  <div class="foot">
    <button class="btn" id="fDel" style="color:#b91c1c">Excluir</button>
    <div style="display:flex;gap:10px"><button class="btn" id="fCancel">Cancelar</button><button class="btn pri" id="fSave">Salvar</button></div>
  </div>
</div></div>
<div class="modal" id="modalL"><div class="sheet">
  <h3 id="lTitle">Novo lote da LIA</h3>
  <div class="two">
    <div class="f"><label>Gerado em</label><input type="date" id="lGerado"></div>
    <div class="f"><label>Último dia pra baixar</label><input type="date" id="lExpira"></div>
  </div>
  <div class="two">
    <div class="f"><label>Quantidade de vídeos</label><input type="number" id="lQtd" min="1"></div>
    <div class="f"><label>Observação (opcional)</label><input type="text" id="lObs"></div>
  </div>
  <div class="foot">
    <button class="btn" id="lDel" style="color:#b91c1c">Excluir</button>
    <div style="display:flex;gap:10px"><button class="btn" id="lCancel">Cancelar</button><button class="btn pri" id="lSave">Salvar</button></div>
  </div>
</div></div>
<div class="toast" id="toast"></div>

<script>
const CANAIS = [
  ['TikTok','#ddd3f2'],['TikTok Shop','#ddd3f2'],
  ['Shopee','#fbdcc4'],['Shopee Vídeo','#fbdcc4'],['Tráfego pago','#cfe3fa'],
  ['Grupos de WhatsApp','#cdeedd'],['Status do WhatsApp','#cdeedd'],['Instagram','#f7d3df'],
  ['Facebook','#d6dcfa'],['Mercado Livre','#fdf0a8'],['Pinterest','#fbc9c9']
];
const COR = Object.fromEntries(CANAIS);
const DIAS = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const KEY = 'minhaPauta.v11';

const D = (t,c,rec={type:'daily'},extra={}) => ({title:t,canal:c,time:'',rec,obs:'',...extra});
const INSIGHTS = {
  'Shopee Vídeo': {
    titulo: 'Como vender mais na Shopee Vídeo',
    itens: [
      'Postar <b>10 vídeos por dia</b> de <b>ofertas relâmpago</b>: o produto já vem impulsionado pela loja e tem mais chance de vender.',
      'Priorizar produtos <b>abaixo de R$ 49,90</b>.',
      'Postar os vídeos todos os dias, nas <b>3 contas</b>.',
      '<b>Verificar quantas unidades o item vende por mês</b> antes de subir, pra saber se está vendendo agora ou se foi bom só meses atrás.',
      '<b>Ranquear o vídeo por retenção</b>: separar os que seguram o público.',
      'Acompanhar a <b>taxa de conversão</b>.',
      '<b>Zero punição</b>: vídeo com problema é descartado, nunca postado. Cada punição derruba o alcance por cerca de 2 semanas.',
      '<b>Horários das postagens</b> (6 lotes de 5 vídeos, com minuto que varia): 9h, 11h, 13h, 17h, 19h e 20h.'
    ]
  }
};
const SEED = [
  // Shopee Vídeo
  D('LIA Vídeos: colocar os 40 links e mandar gerar','Shopee Vídeo',{type:'daily'},{obs:'Gerados na madrugada · ficam 7 dias na LIA e depois são excluídos'}),
  D('LIA Vídeos: revisar, aprovar (final de 10 s ou 8 s) e baixar os vídeos','Shopee Vídeo',{type:'daily'},{obs:'Só libera o download depois de aprovar · vídeo some 7 dias após ser gerado · comece pelos que vencem primeiro'}),
  D('Telegram: enviar os 40 vídeos com os links na aba Envios','Shopee Vídeo',{type:'daily'},{obs:'Canal Shopee Vídeo'}),
  D('Telegram: conferir os vídeos na aba Editados e descartar os com problema','Shopee Vídeo',{type:'daily'},{obs:'Descartar evita punição (pontuação negativa) na Shopee Vídeo'}),
  D('Telegram: colocar as variações e mandar aprovar','Shopee Vídeo',{type:'daily'},{obs:'Depois de aprovado o vídeo vai pra aba Agendas'}),
  D('Telegram: autorizar a postagem nas 3 contas (aba Postagens)','Shopee Vídeo',{type:'daily'},{obs:'As postagens saem às 9h, 11h, 13h, 17h, 19h e 20h'}),
  // Instagram
  D('Postar Reel com sacolinha','Instagram',{type:'daily'},{obs:'Usar o vídeo da Shopee Vídeo e colocar a sacolinha'}),
  D('Postar Reel de teste com sacolinha','Instagram'),
  D('Postar Story com link','Instagram'),
  D('Atualizar Destaque com link','Instagram'),
  // Facebook
  D('Escolher produto no Mercado Livre e criar a foto no Gemini','Facebook'),
  D('Postar no feed com o link do produto','Facebook',{type:'daily'},{obs:'Link também na descrição do produto'}),
  D('Fazer o 1º comentário com o link do produto','Facebook'),
  // WhatsApp
  D('Enviar as ofertas diárias','Grupos de WhatsApp'),
];

let S = load();
let view = 'hoje', filtro = 'Todos', editId = null;
let dia = iso(new Date());

function uid(){return Math.random().toString(36).slice(2,10)}
function iso(d){const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`}
function parse(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function load(){
  try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&r.acts){r.lotes=r.lotes||[];return r}}catch(e){}
  return {acts:SEED.map(a=>({...a,id:uid()})),done:{},lotes:[]};
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Não consegui salvar neste navegador')}}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1800)}
const $=s=>document.querySelector(s);

function ocorre(a,dateStr){
  const d=parse(dateStr),r=a.rec||{type:'daily'};
  if(r.type==='daily')return true;
  if(r.type==='weekly')return (r.days||[]).includes(d.getDay());
  if(r.type==='monthly'){
    const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
    return d.getDate()===Math.min(r.dom||1,last);
  }
  if(r.type==='once')return r.date===dateStr;
  return false;
}
function recTxt(a){
  const r=a.rec||{};
  if(r.type==='daily')return 'Diária';
  if(r.type==='weekly')return (r.days||[]).map(i=>DIAS[i]).join(', ');
  if(r.type==='monthly')return `Todo dia ${r.dom}`;
  return 'Uma vez';
}
const isDone=(id,d)=>!!(S.done[d]&&S.done[d][id]);
function setDone(id,d,v){
  S.done[d]=S.done[d]||{};
  if(v)S.done[d][id]=true;else delete S.done[d][id];
  save();render();
}
function doDia(d){
  return S.acts.filter(a=>ocorre(a,d)).sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));
}

function render(){
  const dt=parse(dia);
  $('#dia').value=dia;
  $('#heroDate').textContent=dt.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});
  $('#heroTitle').textContent = dia===iso(new Date())?'Minha pauta de hoje':'Pauta do dia';
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+view));

  $('#chips').innerHTML=['Todos',...CANAIS.map(c=>c[0])].map(c=>
    `<button class="chip ${filtro===c?'on':''}" style="background:${c==='Todos'?'#e9e6ea':COR[c]}" data-c="${c}">${c}</button>`).join('');

  // lotes da LIA (prazo de validade dos vídeos)
  const hojeS=iso(new Date());
  const dd=e=>Math.round((parse(e)-parse(hojeS))/86400000);
  const dm=x=>x.slice(8)+'/'+x.slice(5,7);
  const pend2=S.lotes.filter(l=>!l.baixado||!l.enviado).sort((a,b)=>a.expira.localeCompare(b.expira));
  const risco=S.lotes.filter(l=>!l.baixado&&dd(l.expira)<=0);
  $('#alerta').innerHTML=risco.length?risco.map(l=>{const n=dd(l.expira);
    return `<div class="alerta">⚠️ ${n===0?'O lote de '+l.qtd+' vídeos expira HOJE':'O lote de '+l.qtd+' vídeos venceu há '+(-n)+' dia(s)'}. ${n===0?'Baixe agora na LIA Vídeos antes de perder!':'Confira na LIA Vídeos se ainda dá pra baixar.'}</div>`}).join(''):'';
  const mostrarLotes=filtro==='Todos'||filtro==='Shopee Vídeo';
  $('#lotesBox').innerHTML=mostrarLotes?`<h2>📦 Lotes da LIA <button class="btn sm" id="lAdd">+ Lote</button></h2><div class="card lotes">`+
    (pend2.length?pend2.map(l=>{
      const n=dd(l.expira);
      let cls,txt;
      if(l.baixado){cls='ok';txt='baixado'}
      else if(n<0){cls='venc';txt='vencido há '+(-n)+' dia(s)'}
      else if(n===0){cls='hoje';txt='expira HOJE'}
      else if(n===1){cls='amanha';txt='expira amanhã'}
      else{cls='';txt='expira em '+n+' dias ('+dm(l.expira)+')'}
      return `<div class="lote"><div><b>${l.qtd} vídeos</b> · gerado ${l.gerado?dm(l.gerado):'—'} <span class="pill ${cls}">${txt}</span>${l.obs?'<div class="meta">'+esc(l.obs)+'</div>':''}</div>
      <div class="act2"><label class="check"><input type="checkbox" data-lb="${l.id}" ${l.baixado?'checked':''}>Baixado</label>
      <label class="check"><input type="checkbox" data-le="${l.id}" ${l.enviado?'checked':''}>No Telegram</label>
      <button class="btn sm" data-ledit="${l.id}">Editar</button></div></div>`}).join('')
    :'<div class="empty">Nenhum lote pendente. Cadastre cada lote gerado na LIA: o vídeo é excluído 7 dias depois de gerado (o último dia pra baixar é o 7º, contando o dia da geração).</div>')+'</div>':'';

  const ins=INSIGHTS[filtro];
  $('#insights').innerHTML=ins?`<div class="insight"><h3>💡 Insights · ${esc(filtro)}</h3><b style="font-size:14px">${ins.titulo}</b><ul>${ins.itens.map(i=>`<li>${i}</li>`).join('')}</ul></div>`:'';

  const lista=doDia(dia).filter(a=>filtro==='Todos'||a.canal===filtro);
  const pend=lista.filter(a=>!isDone(a.id,dia));
  const row=a=>{
    const d=isDone(a.id,dia);
    return `<div class="row ${d?'done':''}">
      <div class="t">${a.time||'A definir'}</div>
      <div><div class="ti">${esc(a.title)}</div>
      <span class="tag" style="background:${COR[a.canal]||'#eee'}">${esc(a.canal)}</span>
      <span class="meta"> ${recTxt(a)}${a.obs?' · '+esc(a.obs):''}</span></div>
      <div class="act"><button class="btn sm" data-edit="${a.id}">Editar</button>
      <label class="check"><input type="checkbox" data-ck="${a.id}" ${d?'checked':''}>Feita</label></div>
    </div>`};
  $('#lista').innerHTML=lista.length?lista.map(row).join(''):'<div class="empty">Nenhuma atividade para este dia. Use “+ Atividade”.</div>';

  const f=pend[0];
  $('#foco').innerHTML=f?`<div class="card focus" style="border-left-color:${COR[f.canal]||'#c2548a'}">
    <small>PRÓXIMA AÇÃO</small><h3>${esc(f.title)}</h3>
    <div class="meta">${f.time||'Horário a definir'} · ${esc(f.canal)} · ${recTxt(f)}</div>
    <div style="margin-top:12px"><label class="check"><input type="checkbox" data-ck="${f.id}">Feita</label></div></div>`
    :`<div class="card">${lista.length?'🎉 Tudo feito por hoje!':'Sua agenda está em dia.'}</div>`;

  const tot=lista.length,ok=tot-pend.length;
  $('#progTxt').textContent=`${ok} de ${tot} ações concluídas`;
  $('#progBar').style.width=(tot?ok/tot*100:0)+'%';

  // semana
  const ini=new Date(dt);ini.setDate(dt.getDate()-dt.getDay());
  let w='';
  for(let i=0;i<7;i++){
    const d=new Date(ini);d.setDate(ini.getDate()+i);const s=iso(d);
    const l=doDia(s),n=l.filter(a=>isDone(a.id,s)).length;
    w+=`<div class="wd ${s===iso(new Date())?'today':''} ${s===dia?'sel':''} ${l.length&&n===l.length?'full':''}" data-d="${s}">
      <small>${DIAS[i]}</small><b>${d.getDate()}</b><span>${n}/${l.length}</span></div>`;
  }
  $('#semana').innerHTML=w;

  // todas
  $('#todas').innerHTML=S.acts.length?S.acts.map(a=>`<div class="row" style="grid-template-columns:1fr">
    <div><div class="ti">${esc(a.title)}</div>
    <span class="tag" style="background:${COR[a.canal]||'#eee'}">${esc(a.canal)}</span>
    <span class="meta"> ${a.time||'sem horário'} · ${recTxt(a)}${a.obs?' · '+esc(a.obs):''}</span></div>
    <div class="act"><button class="btn sm" data-edit="${a.id}">Editar</button></div></div>`).join(''):'<div class="empty">Nenhuma atividade.</div>';
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

// ---- modal
function recUI(){
  const t=$('#fRec').value;
  $('#fDiasBox').style.display=t==='weekly'?'':'none';
  $('#fDomBox').style.display=t==='monthly'?'':'none';
}
function openModal(id){
  editId=id||null;
  const a=id?S.acts.find(x=>x.id===id):{title:'',canal:filtro!=='Todos'?filtro:CANAIS[0][0],time:'',rec:{type:'daily'},obs:''};
  $('#mTitle').textContent=id?'Editar atividade':'Nova atividade';
  $('#fTitulo').value=a.title;
  $('#fCanal').innerHTML=CANAIS.map(c=>`<option ${c[0]===a.canal?'selected':''}>${c[0]}</option>`).join('');
  $('#fHora').value=a.time||'';
  $('#fRec').value=a.rec.type;
  $('#fDias').innerHTML=DIAS.map((d,i)=>`<label><input type="checkbox" value="${i}" ${(a.rec.days||[]).includes(i)?'checked':''}><span>${d}</span></label>`).join('');
  $('#fDom').value=a.rec.dom||parse(dia).getDate();
  $('#fObs').value=a.obs||'';
  $('#fDel').style.visibility=id?'visible':'hidden';
  recUI();$('#modal').classList.add('open');
}
function closeModal(){$('#modal').classList.remove('open')}
function saveModal(){
  const title=$('#fTitulo').value.trim();
  if(!title){toast('Dê um nome para a atividade');return}
  const type=$('#fRec').value;
  const rec={type};
  if(type==='weekly'){rec.days=[...document.querySelectorAll('#fDias input:checked')].map(i=>+i.value);if(!rec.days.length){toast('Escolha ao menos um dia');return}}
  if(type==='monthly')rec.dom=Math.min(31,Math.max(1,+$('#fDom').value||1));
  if(type==='once')rec.date=dia;
  const a={title,canal:$('#fCanal').value,time:$('#fHora').value,rec,obs:$('#fObs').value.trim()};
  if(editId){Object.assign(S.acts.find(x=>x.id===editId),a)}else S.acts.push({id:uid(),...a});
  save();closeModal();render();toast('Salvo');
}

// ---- eventos
document.addEventListener('click',e=>{
  const t=e.target;
  if(t.dataset.v){view=t.dataset.v;render()}
  else if(t.dataset.c){filtro=t.dataset.c;render()}
  else if(t.dataset.edit)openModal(t.dataset.edit);
  else if(t.hasAttribute('data-add'))openModal();
  else if(t.closest('.wd')){dia=t.closest('.wd').dataset.d;view='hoje';render()}
});
document.addEventListener('change',e=>{
  if(e.target.dataset.ck)setDone(e.target.dataset.ck,dia,e.target.checked);
});
let editL=null,expTouched=false;
function addDays(sd,n){const d=parse(sd);d.setDate(d.getDate()+n);return iso(d)}
$('#lExpira').oninput=()=>{expTouched=true};
$('#lGerado').onchange=()=>{if(!expTouched&&$('#lGerado').value)$('#lExpira').value=addDays($('#lGerado').value,6)};
function openL(id){
  editL=id||null;
  const l=id?S.lotes.find(x=>x.id===id):{gerado:iso(new Date()),expira:'',qtd:40,obs:''};
  $('#lTitle').textContent=id?'Editar lote':'Novo lote da LIA';
  expTouched=!!id;
  $('#lGerado').value=l.gerado||'';$('#lExpira').value=l.expira||(l.gerado?addDays(l.gerado,6):'');$('#lQtd').value=l.qtd;$('#lObs').value=l.obs||'';
  $('#lDel').style.visibility=id?'visible':'hidden';
  $('#modalL').classList.add('open');
}
const closeL=()=>$('#modalL').classList.remove('open');
$('#lCancel').onclick=closeL;
$('#modalL').onclick=e=>{if(e.target.id==='modalL')closeL()};
$('#lSave').onclick=()=>{
  const expira=$('#lExpira').value;
  if(!expira){toast('Informe quando o lote expira');return}
  const d={gerado:$('#lGerado').value,expira,qtd:+$('#lQtd').value||40,obs:$('#lObs').value.trim()};
  if(editL)Object.assign(S.lotes.find(x=>x.id===editL),d);else S.lotes.push({id:uid(),baixado:false,enviado:false,...d});
  save();closeL();render();toast('Lote salvo');
};
$('#lDel').onclick=()=>{if(confirm('Excluir este lote?')){S.lotes=S.lotes.filter(x=>x.id!==editL);save();closeL();render()}};
document.addEventListener('click',e=>{
  const t=e.target;
  if(t.id==='lAdd')openL();
  else if(t.dataset.ledit)openL(t.dataset.ledit);
});
document.addEventListener('change',e=>{
  const t=e.target;
  const l=S.lotes.find(x=>x.id===(t.dataset.lb||t.dataset.le));
  if(!l)return;
  if(t.dataset.lb)l.baixado=t.checked;
  if(t.dataset.le)l.enviado=t.checked;
  save();render();
});
$('#dia').onchange=e=>{if(e.target.value){dia=e.target.value;render()}};
$('#hojeBtn').onclick=()=>{dia=iso(new Date());render()};
$('#fRec').onchange=recUI;
$('#fCancel').onclick=closeModal;
$('#fSave').onclick=saveModal;
$('#fDel').onclick=()=>{if(confirm('Excluir esta atividade?')){S.acts=S.acts.filter(a=>a.id!==editId);save();closeModal();render()}};
$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
$('#exp').onclick=()=>{
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));
  a.download='minha-pauta-backup.json';a.click();
};
$('#imp').onclick=()=>$('#impFile').click();
$('#impFile').onchange=async e=>{
  try{const j=JSON.parse(await e.target.files[0].text());if(!j.acts)throw 0;S=j;save();render();toast('Importado')}catch(x){toast('Arquivo inválido')}
};
render();
</script>
</body>
</html>
