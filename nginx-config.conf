# ==========================================
# COMO USAR:
# ==========================================
#
# 1. Copie este arquivo:
#    sudo cp nginx-config.conf /etc/nginx/sites-available/financeiro.conf
#
# 2. Habilite o site:
#    sudo ln -s /etc/nginx/sites-available/financeiro.conf /etc/nginx/sites-enabled/
#
# 3. Teste a configuração:
#    sudo nginx -t
#
# 4. Recarregue Nginx:
#    sudo systemctl reload nginx
#
# 5. Acesse via:
#    http://financeiro.seu-dominio.com (se usar Option 1)
#    ou
#    http://seu-dominio.com/financeiro (se usar Option 2)
#
# ==========================================
# SSL/HTTPS com Let's Encrypt (OPCIONAL):
# ==========================================
#
# 1. Instale Certbot:
#    sudo apt-get install certbot python3-certbot-nginx
#
# 2. Gere certificado:
#    sudo certbot certonly --nginx -d financeiro.seu-dominio.com
#
# 3. Nginx será atualizado automaticamente
#
# ==========================================
